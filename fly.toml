# Empty on purpose: fly and the server refuse to run until sveet-setup (or you) fill in app and ORIGIN.
app = ''
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/sqlite.db'
  ORIGIN = ''
  PORT = '3000'
  # Otherwise every visitor shares the proxy's IP and one rate-limit bucket.
  ADDRESS_HEADER = 'Fly-Client-IP'
  # SCW_SECRET_KEY and SCW_DEFAULT_PROJECT_ID are `fly secrets`; use 'console' until mail is set up.
  MAIL_TRANSPORT = 'scaleway'
  MAIL_FROM = 'login@mail.example.com'

# A volume mounts on one machine only: scale up, not out, while the data is SQLite.
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Fly's default (25) is hit long before bun or SQLite are busy.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
